{% load static %}
<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign in | PrepWise</title><link rel="stylesheet" href="{% static 'css/app.css' %}"></head><body class="auth-body"><div class="auth-card"><a class="brand" href="/"><span class="brand-mark">P</span> PrepWise</a><h1>Welcome back</h1><p>Continue building your interview confidence.</p>{% if messages %}{% for message in messages %}<div class="form-message">{{ message }}</div>{% endfor %}{% endif %}<form method="post">{% csrf_token %}<label>Username<input name="username" autocomplete="username" required></label><label>Password<div class="password-row"><input name="password" type="password" autocomplete="current-password" required><a href="{% url 'password_reset' %}">Forgot password?</a></div></label><button class="button primary full">Sign in →</button></form><p class="auth-switch">New to PrepWise? <a href="{% url 'register' %}">Create an account</a></p></div></body></html>
