{% load static %}
<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Create account | PrepWise</title><link rel="stylesheet" href="{% static 'css/app.css' %}"></head><body class="auth-body"><div class="auth-card wide"><a class="brand" href="/"><span class="brand-mark">P</span> PrepWise</a><h1>Create your account</h1><p>Start your personalized interview journey.</p>{% if messages %}{% for message in messages %}<div class="form-message">{{ message }}</div>{% endfor %}{% endif %}<form method="post">{% csrf_token %}<div class="form-grid"><label>First name<input name="first_name"></label><label>Last name<input name="last_name"></label></div><label>Username<input name="username" autocomplete="username" required></label><label>Email address<input name="email" type="email" autocomplete="email" required></label><label>Password<input name="password" type="password" minlength="8" autocomplete="new-password" required></label><label>Confirm password<input name="confirmation" type="password" minlength="8" autocomplete="new-password" required></label><button class="button primary full">Create account →</button></form><p class="auth-switch">Already have an account? <a href="{% url 'login' %}">Sign in</a></p></div></body></html>
