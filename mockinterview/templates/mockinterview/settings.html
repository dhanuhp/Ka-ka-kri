{% extends 'mockinterview/base.html' %}{% block content %}
<header class="topbar"><div><p class="eyebrow">PREFERENCES</p><h1>Settings</h1></div></header>
<section class="content"><div class="settings-grid"><form class="settings-card" method="post">{% csrf_token %}<input type="hidden" name="action" value="password"><h2>Change password</h2>{% if messages %}{% for message in messages %}<div class="form-message">{{ message }}</div>{% endfor %}{% endif %}<label>Current password<input type="password" name="current_password" required></label><label>New password<input type="password" name="new_password" minlength="8" required></label><button class="button primary">Update password</button></form><form class="settings-card" method="post">{% csrf_token %}<input type="hidden" name="action" value="notifications"><h2>Notifications</h2><label class="toggle-row"><input type="checkbox" checked> Practice reminders</label><label class="toggle-row"><input type="checkbox" checked> Weekly performance report</label><button class="button secondary">Save preferences</button></form></div></section>{% endblock %}
